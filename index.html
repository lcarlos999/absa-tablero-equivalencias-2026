<script>
'use strict';const db=JSON.parse(document.getElementById('data').textContent);const LS='ABSA_V22_USD_COSTOS_LOCAL_20261103';const pages={resumen:'Resumen financiero',presupuesto:'Presupuesto documental',catalogo:'Costeo por SKU',concentracion:'Concentración USD',duplicados:'Riesgo de duplicados',decisiones:'Recomendaciones',metodo:'Metodología'};let state={page:'resumen',search:'',division:'',group:'',policy:'',priced:'',pageNumber:0,sort:'cost-desc'};const rows=db.rows,allSku=[...new Set(rows.map(x=>x.sku))].sort();let userCost={};try{const raw=JSON.parse(localStorage.getItem(LS)||'{}');if(raw&&typeof raw==='object')userCost=Object.fromEntries(Object.entries(raw).filter(([k,v])=>allSku.includes(k)&&v!==null&&v!==''&&Number.isFinite(Number(v))&&Number(v)>=0).map(([k,v])=>[k,Number(v)]))}catch(e){};const fmt=new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',minimumFractionDigits:0,maximumFractionDigits:2});const num=n=>Number(n||0).toLocaleString('es-MX');const money=n=>fmt.format(Number(n||0));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const clean=s=>String(s??'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');const hasCost=sku=>Object.hasOwn(userCost,sku)&&Number.isFinite(userCost[sku]);const val=r=>hasCost(r.sku)?Number(r.qty||0)*userCost[r.sku]:null;const total=(r)=>r.reduce((a,x)=>a+(val(x)??0),0);const count=(arr,fn)=>arr.filter(fn).length;const baseline=db.groups.reduce((s,g)=>s+g.usd,0);const covered=()=>allSku.filter(hasCost).length;const totalKnown=()=>total(rows);const complete=()=>covered()===allSku.length;const countUnpriced=(rs)=>new Set(rs.filter(r=>!hasCost(r.sku)).map(r=>r.sku)).size;const divs=['Industrial Automation','Power Products'];const groupName=id=>db.groups.find(g=>g.helios===id)?.label||'Sin clasificar';const groups=[...new Set(rows.map(r=>r.helios))].filter(Boolean).sort();const visible=()=>rows.filter(r=>(!state.search||clean([r.sku,r.description,r.family,r.ra].join(' ')).includes(clean(state.search)))&&(!state.division||r.division===state.division)&&(!state.group||r.helios===state.group)&&(!state.policy||r.policy===state.policy)&&(!state.priced||(state.priced==='costeado')===hasCost(r.sku)));const by=(id)=>document.getElementById(id);const highlight=(label,text,cls='')=>`<div class="card ${cls}"><small>${esc(label)}</small><strong>${text}</strong><span>${esc(label==='Costo depurado'?'Sólo se habilita con 100% de costos reales cargados':'Sin suponer precios unitarios')}</span></div>`;const head=(ey,t,desc)=>`<div class="pagehead"><div class="eyebrow">${ey}</div><h1>${t}</h1><p>${desc}</p></div>`;const sect=(name,desc='')=>`<div class="sectionTitle"><h2>${name}</h2><small>${desc}</small></div>`;const hint=(s,critical=false)=>`<div class="warning ${critical?'critical':''}"><strong>${critical?'Alerta financiera':'Criterio de interpretación'}</strong>${s}</div>`;const metrics=()=>`<div class="cards">${highlight('Presupuesto sin depurar',money(baseline))}${highlight('Costo depurado',complete()?money(totalKnown()):'N/D','alert')}${highlight('Cobertura de costos',`${covered()} / ${allSku.length} SKU`)}${highlight('Monto costeado parcial',money(totalKnown()))}</div>`;const bars=(items,limit=10)=>{const max=Math.max(1,...items.slice(0,limit).map(x=>x.value));return items.slice(0,limit).map(x=>`<div class="barrow"><span class="barname" title="${esc(x.name)}">${esc(x.name)}</span><div class="track"><div class="fill" style="width:${x.value>0?Math.max(1,100*x.value/max):0}%"></div></div><span class="amount">${money(x.value)}</span></div>`).join('')};const budgetRows=()=>db.groups.map(g=>`<tr><td class="mono">${esc(g.helios)}</td><td>${esc(g.division)}</td><td>${esc(g.label)}</td><td class="currency">${money(g.usd)}</td><td><span class="tag bad">SIN FILTRAR POR ROJO</span></td></tr>`).join('');const budgetChart=()=>bars([...db.groups].map(g=>({name:g.label,value:g.usd})).sort((a,b)=>b.value-a.value),9);
function summaryPage(){const ref=db.groups.map(g=>({name:g.label,value:g.usd})).sort((a,b)=>b.value-a.value);return head('EXCLUSIVO V2.2 · SOLO COSTOS USD','El costo de la decisión','Análisis financiero del inventario Schneider con exclusión de los renglones rojos. El total original es documental, no representa el costo de la lista depurada.')+metrics()+hint('El archivo V2.2 sólo contiene 9 subtotales monetarios por grupo. No hay costo por referencia. Para calcular la inversión de los SKU conservados, captura el costo unitario USD real de cada SKU en «Costeo por SKU».',true)+sect('Concentración del presupuesto registrado','Montos originales · sin excluir el costo de las filas rojas')+`<div class="panels"><div class="panel"><h3>Distribución de presupuesto original por grupo</h3>${bars(ref,9)}</div><div class="panel"><h3>Decisiones monetarias posibles ahora</h3><ul class="list"><li><strong>Asignación inicial por rubro</strong><p>Identificar categorías de mayor presupuesto; estas cifras no son el costo final depurado.</p></li><li><strong>Control de riesgos</strong><p>Evitar convertir los SKU en rojo en compra; sus importes particulares son desconocidos.</p></li><li><strong>Depuración por costo</strong><p>Ingresar precios de  ${allSku.length.toLocaleString('es-MX')} SKU únicos; el tablero recalcula automáticamente montos y concentración.</p></li><li><strong>Bloqueo de inferencias</strong><p>No calcular sobrecompra, ahorros, margen o ROI sin costo unitario y demanda verificada.</p></li></ul></div></div>`+sect('Indicadores monetarios al completar precios','Cálculos dinámicos de costos reales')+`<div class="grid3"><div class="panel"><h3>Valor de inventario</h3><p class="note">Costo unitario × cantidad auxiliar de la propuesta, sólo para referencias no rojas.</p><div class="currency">${complete()?money(totalKnown()):'Pendiente de costos'}</div></div><div class="panel"><h3>Exposición de MTO prioritario</h3><p class="note">Valor costeado de referencias marcadas high runner y MTO.</p><div class="currency">${money(total(rows.filter(r=>r.policy==='MTO'&&/high\s*runner/i.test(r.rotation))))}</div><small class="muted">Parcial, sujeto a cobertura</small></div><div class="panel"><h3>Cruces Rockwell documentados</h3><p class="note">Exposición de costo en los códigos que contienen referencia cruzada en este Excel.</p><div class="currency">${money(total(rows.filter(r=>r.ra)))}</div><small class="muted">No demuestra homologación técnica</small></div></div>`}
function budgetPage(){const d=divs.map(div=>({name:div,value:db.groups.filter(x=>x.division===div).reduce((a,x)=>a+x.usd,0)}));return head('SUBTOTALES FUENTE · SIN AJUSTAR','Presupuesto del archivo V2.2','Estos importes sí están en el Excel adjunto. Son subtotales originales, NO el costo de las referencias que permanecen tras excluir los rojos.')+`<div class="cards">${highlight('Total documental',money(baseline))}${highlight('Industrial Automation',money(d[0].value))}${highlight('Power Products',money(d[1].value))}${highlight('Costo exclusivo sin rojos','NO DISPONIBLE','alert')}</div>`+hint('Un subtotal en una fila de SKU NO es el costo individual de ese SKU: agrupa una categoría de productos. Restarlo o mantenerlo íntegro después de eliminar filas rojas generaría conclusiones incorrectas.',true)+sect('Distribución financiera por categoría')+`<div class="panels"><div class="panel"><h3>Presupuesto original por HELIOS</h3>${budgetChart()}</div><div class="panel"><h3>Estado de la reconciliación</h3><ul class="list"><li><strong>9 subtotales documentados</strong><p>Se leyeron directamente de las dos pestañas del Excel V2.2.</p></li><li><strong>${num(db.excluded)} referencias en rojo</strong><p>Fuera del cálculo depurado y fuera del catálogo comercial analizado.</p></li><li><strong>${num(db.included)} referencias restantes</strong><p>Sin costos unitarios, todavía no existe un monto confiable de inversión post-exclusión.</p></li></ul></div></div>`+sect('Detalle del presupuesto original')+`<div class="tableWrap"><table class="datatable"><thead><tr><th>HELIOS</th><th>División</th><th>Grupo de producto</th><th>Importe USD</th><th>Calidad</th></tr></thead><tbody>${budgetRows()}</tbody></table></div>`}
function filterToolbar(){return `<div class="toolbar"><input class="search" id="search" value="${esc(state.search)}" placeholder="Buscar SKU, descripción o referencia Rockwell..." aria-label="Buscar producto"><select id="div"><option value="">Ambas divisiones</option>${divs.map(d=>`<option value="${esc(d)}" ${state.division===d?'selected':''}>${esc(d)}</option>`).join('')}</select><select id="group"><option value="">Todos los HELIOS</option>${groups.map(g=>`<option value="${esc(g)}" ${state.group===g?'selected':''}>${esc(g)}</option>`).join('')}</select><select id="policy"><option value="">MTO / MTS</option><option value="MTO" ${state.policy==='MTO'?'selected':''}>MTO</option><option value="MTS" ${state.policy==='MTS'?'selected':''}>MTS</option></select><select id="priced"><option value="">Todos</option><option value="costeado" ${state.priced==='costeado'?'selected':''}>Con costo</option><option value="sin" ${state.priced==='sin'?'selected':''}>Sin costo</option></select></div>`}
function catalogPage(){let rs=visible(),size=35, pages=Math.max(1,Math.ceil(rs.length/size));state.pageNumber=Math.min(state.pageNumber,pages-1);const slice=rs.slice(state.pageNumber*size,(state.pageNumber+1)*size);const card=metrics();return head('SKU VÁLIDOS · CARGA DE COSTOS USD','Costo real por referencia','Los registros en rojo ya no forman parte del análisis. Introduce el costo real de compra en USD. Las cantidades se usan exclusivamente como factor para calcular valor monetario; no son un KPI de decisión.')+card+sect('Ingreso de precios y exportación')+`<div class="panel"><div class="actions"><button class="btn soft" id="template2">↓ Plantilla de 719 SKU</button><button class="btn" id="downloadPrices">↓ Exportar precios locales</button><button class="btn danger" id="clearCosts">Limpiar costos locales</button></div><div class="upload"><strong>Cargar precios desde CSV (opcional)</strong><p class="note">Encabezados: <code>sku,costo_usd</code>. Se aplican únicamente a los SKU conservados. Los precios permanecen en este navegador, no en el servidor público.</p><input type="file" accept=".csv,text/csv" id="fileUpload"><span id="uploadStatus" class="statusline"></span></div></div>`+sect('Explorador de costos','Buscar y filtrar; editar el costo unitario USD')+filterToolbar()+`<div class="tableWrap"><table class="datatable"><thead><tr><th>SKU</th><th>División · familia</th><th>HELIOS</th><th>Política</th><th>Costo unitario USD</th><th>Costo total USD</th><th>Dato auxiliar de cantidad</th><th>Estado</th></tr></thead><tbody>${slice.map(r=>`<tr><td class="mono">${esc(r.sku)}${r.ra?`<div class="muted">RA: ${esc(r.ra)}</div>`:''}</td><td class="namewidth">${esc(r.division)}<div class="muted">${esc(r.family)}</div></td><td>${esc(r.helios)}</td><td>${esc(r.policy||'N/D')}</td><td><input class="price" type="number" step="0.01" min="0" data-price="${esc(r.sku)}" value="${hasCost(r.sku)?String(userCost[r.sku]):''}" placeholder="Falta precio" aria-label="Costo USD de ${esc(r.sku)}"></td><td class="currency">${hasCost(r.sku)?money(val(r)):'—'}</td><td>${num(r.qty)}</td><td>${hasCost(r.sku)?'<span class="tag good">COSTEADO</span>':'<span class="tag bad">SIN COSTO</span>'}</td></tr>`).join('')}</tbody></table></div><div class="pagination"><span>${num(rs.length)} registros · Página ${state.pageNumber+1} de ${pages} · Costeo <strong>${covered()} de ${allSku.length} SKU</strong></span><div><button id="prev" ${state.pageNumber<=0?'disabled':''}>←</button><button id="next" ${state.pageNumber>=pages-1?'disabled':''}>→</button></div></div><p class="foot">La información de cantidad sólo interviene en la operación matemática costo × cantidad; los análisis y las prioridades se calculan exclusivamente en dólares.</p>`}
function grouping(rs,mapper){const a=new Map();for(let r of rs){let key=mapper(r);const v=a.get(key)||{name:key,value:0,priced:0,total:0};v.total++;if(hasCost(r.sku)){v.priced++;v.value+=val(r)}a.set(key,v)}return [...a.values()].sort((x,y)=>y.value-x.value)}
function concentrationPage(){let div=grouping(rows,r=>r.division),he=grouping(rows,r=>r.helios||'Sin HELIOS'),fam=grouping(rows,r=>r.family||'Sin familia'),pol=grouping(rows,r=>r.policy||'Sin política');let notes=()=>complete()?'Todos los SKU del universo filtrado están costeados.':'Estos montos SON PARCIALES: sólo suman SKU con costo ingresado y no representan la inversión total.';return head('COSTO USD · ANÁLISIS DINÁMICO','Concentración del capital','Prioridad financiera por montos reales registrados, no por número de piezas. Los importes se actualizan al ingresar costos unitarios.')+metrics()+hint(notes(),!complete())+sect('Costo por división')+`<div class="panel">${bars(div,5)}<p class="foot">Cobertura de renglones: ${div.map(x=>x.name+': '+x.priced+'/'+x.total).join(' | ')}</p></div>`+sect('Costo por grupo y familia')+`<div class="panels equal"><div class="panel"><h3>Por grupo HELIOS</h3>${bars(he,14)}</div><div class="panel"><h3>Por familia de producto</h3>${bars(fam,15)}</div></div>`+sect('Exposición por política de inventario')+`<div class="panel"><h3>Monto MTS/MTO costeado</h3>${bars(pol,7)}</div>`}
function duplicatePage(){const grouped={};for(let r of rows.filter(r=>r.division==='Power Products'))(grouped[r.sku]??=[]).push(r);const dupe=Object.entries(grouped).filter(([s,l])=>l.length>1).map(([sku,rs])=>({sku,group:rs[0].family,div:rs[0].division,known:hasCost(sku),cost:hasCost(sku)?db.dup_skus[sku]*userCost[sku]:null,unit:userCost[sku],extra:db.dup_skus[sku]||0}));const priced=dupe.filter(x=>x.known);const dupCost=priced.reduce((sum,x)=>sum+x.cost,0);const done=priced.length===dupe.length;return head('POTENCIAL SOBRECOSTO USD','Duplicidad de SKUs en Power','La exposición monetaria sólo existe para SKU repetidos que ya tienen costo unitario documentado. No equivale automáticamente a compra innecesaria.')+`<div class="cards">${highlight('Exposición monetaria',done?money(dupCost):'N/D','alert')}${highlight('Monto en SKU costeados',money(dupCost))}${highlight('Costos duplicados conocidos',`${priced.length} / ${dupe.length} SKU`)}${highlight('Ahorro confirmado', 'NO DETERMINABLE','alert')}</div>`+hint('Los renglones repetidos pueden corresponder a solicitudes o proyectos distintos. El «riesgo duplicado» es sólo un escenario si se comprara una vez por cada fila, y requiere aprobación de Compras y validación de demanda.',true)+sect('Detalle financiero de los SKU repetidos')+`<div class="tableWrap"><table class="datatable"><thead><tr><th>SKU</th><th>Familia</th><th>Estado de costo</th><th>Costo unitario USD</th><th>Exposición potencial USD</th><th>Decisión</th></tr></thead><tbody>${dupe.sort((a,b)=>(b.cost||0)-(a.cost||0)).map(r=>`<tr><td class="mono">${esc(r.sku)}</td><td>${esc(r.group)}</td><td>${r.known?'<span class="tag good">Costeado</span>':'<span class="tag bad">Falta costo</span>'}</td><td>${r.known?money(r.unit):'—'}</td><td class="currency">${r.known?money(r.cost):'No calculable'}</td><td>Reconciliar por cliente / proyecto</td></tr>`).join('')}</tbody></table></div>`}
function decisionsPage(){const list=[['01 · Compras','Construir costo depurado por SKU','Solicitar lista de precios de compra Schneider (USD) y capturar por SKU. No aprobar presupuesto neto sin cobertura de precios.'],['02 · Contraloría','Separar presupuesto original y real depurado','Conservar los US$2.30 M como referencia documental; sólo la suma de costo real de referencias no rojas puede ser base de autorización.'],['03 · Producto','Priorizar costo inmovilizado, no rotación física','Cruzar costo USD con MTS/MTO, lead time y demanda para decidir qué comprar como stock y qué manejar bajo pedido.'],['04 · Compras / Panel One','Valorar duplicidades en USD','Revisar SKU que se repiten y calcular exposición monetaria potencial. Validar si representan proyectos distintos.'],['05 · Comercial','Validar valor de cruces Rockwell','Los cruces explícitos en V2.2 no son homologaciones. Confirmar compatibilidad antes de usar las referencias en venta.'],['06 · Finanzas','Medir margen y costo financiero','Solicitar precios de venta, consumo histórico, plazo de cobro y capital de trabajo. Sin estas variables no se estima ROI o margen.']];return head('PLAN DE DECISIÓN FINANCIERA','Recomendaciones de inversión','Acciones asociadas a riesgo y costo, sin clasificar familias por número de piezas.')+metrics()+sect('Decisiones financieras para ABSA')+`<div class="grid3">${list.map(x=>`<div class="panel"><h3>${esc(x[0])}</h3><strong>${esc(x[1])}</strong><p class="note">${esc(x[2])}</p></div>`).join('')}</div>`+sect('Controles antes de autorizar la compra')+`<div class="panel"><ul class="list"><li><strong>Precios de compra completos y vigentes</strong><p>Confirmar moneda, vigencia, INCOTERM, impuestos, descuentos, flete y tipo de cambio contractual.</p></li><li><strong>Catálogo aprobado y sin renglones rojos</strong><p>Conservar bitácora de exclusiones del archivo, sin borrar la evidencia original.</p></li><li><strong>Demanda y margen estimados</strong><p>Comparar inversión con ventas, rotación monetaria, margen bruto, obsolescencia y costo de financiamiento.</p></li><li><strong>Aprobación técnica de equivalencias</strong><p>No sustituir la verificación eléctrica y normativa por coincidencia de nomenclatura.</p></li></ul></div>`}
function methodPage(){return head('TRAZABILIDAD · V2.2','Qué se calculó y qué no','Transparencia completa de los límites de la información disponible para la toma de decisiones.')+`<div class="panel"><h3>Archivo utilizado</h3><p class="note"><strong>${esc(db.source)}</strong><br>Sólo hojas Industrial Automation y Power Products del archivo nuevo. Se excluyen las referencias con <strong>fondo rojo sólido #FF0000 en su celda SKU</strong>. Las celdas de otros colores se conservan.</p></div>`+sect('Diferencias que importan')+`<div class="panels equal"><div class="panel"><h3>Calculable con el archivo</h3><ul class="list"><li>Presupuesto original del Excel, en USD por 9 grupos.</li><li>Registros incluidos/excluidos y clasificación del portafolio.</li><li>SKU con información de política, demanda sugerida y cruce Rockwell.</li><li>Escenarios de costo sólo cuando se cargan precios unitarios reales.</li></ul></div><div class="panel"><h3>No calculable sin datos adicionales</h3><ul class="list"><li>Costo total real excluyendo renglones rojos.</li><li>Valor en USD de referencias eliminadas.</li><li>Ahorro monetario por duplicados.</li><li>Margen, EBITDA, ROI o costo financiero por SKU.</li><li>Valor real de stock por familia si faltan precios.</li></ul></div></div>`+sect('Fórmulas y controles')+`<div class="panel"><ul class="list"><li><strong>Valor depurado USD:</strong> Σ(costo unitario USD × cantidad auxiliar) de SKU no rojos. Sólo se considera total definitivo con cobertura de 100% de costos.</li><li><strong>Concentración USD:</strong> suma de valor depurado por familia, categoría, división y política MTO/MTS. Parcial mientras falten precios.</li><li><strong>Riesgo duplicado USD:</strong> Σ[(cantidad total − máxima cantidad de fila por SKU repetido) × costo unitario]. Escenario de conciliación, no ahorro real.</li><li><strong>Almacenamiento:</strong> precios ingresados en la página se conservan sólo en el almacenamiento local del navegador. No se publican ni sincronizan entre usuarios. Puedes exportar/importar CSV.</li></ul></div>`}
const renderers={resumen:summaryPage,presupuesto:budgetPage,catalogo:catalogPage,concentracion:concentrationPage,duplicados:duplicatePage,decisiones:decisionsPage,metodo:methodPage};
function render(scroll){by('content').innerHTML=renderers[state.page]();by('crumb').textContent=pages[state.page];document.querySelectorAll('#nav button').forEach(btn=>btn.classList.toggle('active',btn.dataset.page===state.page));if(scroll)window.scrollTo(0,0)}
function csvField(x){const s=String(x??'');return /[",\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}function downloadCSV(list,name){const flds=Object.keys(list[0]||{sku:'',costo_usd:''}),payload='\ufeff'+flds.map(csvField).join(',')+'\r\n'+list.map(r=>flds.map(k=>csvField(r[k])).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([payload],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}function priceTemplate(){downloadCSV(allSku.map(sku=>({sku,costo_usd:hasCost(sku)?userCost[sku]:''})),'ABSA_V22_plantilla_costos_USD.csv')}function exportReport(){let arr=visible().map(r=>({division:r.division,helios:r.helios,familia:r.family,sku:r.sku,descripcion:r.description,politica:r.policy,costo_unitario_usd:hasCost(r.sku)?userCost[r.sku]:'',inversion_usd:val(r)??'',cantidad_auxiliar:r.qty,ref_rockwell:r.ra}));downloadCSV(arr,'ABSA_V22_analisis_sin_rojo_costos_USD.csv')}
function savePrice(sku,amount){const n=amount.trim()===''?null:Number(amount);if(n===null)delete userCost[sku];else if(Number.isFinite(n)&&n>=0)userCost[sku]=n;else{alert('El costo debe ser un número USD mayor o igual a cero.');return}try{localStorage.setItem(LS,JSON.stringify(userCost))}catch(e){}render(false)}
function csvParse(txt){let out=[],field='',row=[],quoted=false;txt=txt.replace(/^\uFEFF/,'');for(let i=0;i<txt.length;i++){const ch=txt[i];if(ch==='"'){if(quoted&&txt[i+1]==='"'){field+='"';i++}else quoted=!quoted}else if(ch===','&&!quoted){row.push(field);field=''}else if((ch==='\n'||ch==='\r')&&!quoted){if(ch==='\r'&&txt[i+1]==='\n')i++;row.push(field);if(row.some(x=>x!==''))out.push(row);row=[];field=''}else field+=ch}if(field||row.length){row.push(field);out.push(row)}return out}
function handleUpload(file){if(!file)return;file.text().then(txt=>{let csv=csvParse(txt),head=(csv.shift()||[]).map(x=>clean(x.trim()));const i=head.indexOf('sku'),j=head.findIndex(x=>x==='costo_usd'||x==='costousd'||x==='costo unitario usd');if(i<0||j<0){alert('El CSV debe contener columnas sku,costo_usd');return}let ok=0;const valid=new Set(allSku);for(let r of csv){let sku=String(r[i]||'').trim(),v=String(r[j]||'').trim();if(valid.has(sku)&&v!==''&&Number.isFinite(Number(v))&&Number(v)>=0){userCost[sku]=Number(v);ok++}}try{localStorage.setItem(LS,JSON.stringify(userCost))}catch(e){}alert(`${ok} costos cargados localmente; revisa cobertura y totales.`);render(false)}).catch(e=>alert('No se pudo leer el CSV.'))}
document.addEventListener('click',e=>{const nav=e.target.closest('button[data-page]');if(nav){state.page=nav.dataset.page;state.pageNumber=0;location.hash=nav.dataset.page;render(true);return}const id=e.target.id;if(id==='downloadTemplate'||id==='template2'){priceTemplate();return}if(id==='exportRows'){exportReport();return}if(id==='downloadPrices'){downloadCSV(Object.entries(userCost).map(([sku,costo_usd])=>({sku,costo_usd})),'ABSA_V22_costos_guardados_localmente.csv');return}if(id==='clearCosts'){if(confirm('¿Borrar todos los costos guardados en este navegador?')){userCost={};localStorage.removeItem(LS);render(false)}return}if(id==='prev'){state.pageNumber--;render(false);return}if(id==='next'){state.pageNumber++;render(false);return}});
document.addEventListener('change',e=>{if(e.target.dataset.price){savePrice(e.target.dataset.price,e.target.value);return}if(e.target.id==='fileUpload'){handleUpload(e.target.files?.[0]);return}let m={div:'division',group:'group',policy:'policy',priced:'priced'};if(m[e.target.id]){state[m[e.target.id]]=e.target.value;state.pageNumber=0;render(false)}});
let qtimeout;document.addEventListener('input',e=>{if(e.target.id==='search'){const v=e.target.value,p=e.target.selectionStart;clearTimeout(qtimeout);qtimeout=setTimeout(()=>{state.search=v;state.pageNumber=0;render(false);const i=by('search');if(i){i.focus();try{i.setSelectionRange(p,p)}catch(e){}}},210)}});
const first=location.hash.slice(1);if(pages[first])state.page=first;window.addEventListener('hashchange',()=>{let key=location.hash.slice(1);if(pages[key]&&state.page!==key){state.page=key;render(true)}});render(false);
</script></body></html>
