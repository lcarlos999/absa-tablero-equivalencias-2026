function table(headers,rows){return `<div class="tablebox"><div class="scroll"><table><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.join('')||`<tr><td colspan="${headers.length}">Sin coincidencias para estos filtros.</td></tr>`}</tbody></table></div></div>`}
function toolbar(kind){let set=kind==='ia'?A:kind==='power'?P:kind==='cruces'?cross:[];let opt=(key,label)=>`<div class="field"><label>${label}</label><select data-filter="${key}"><option value="">Todos</option>${[...new Set(set.map(r=>String(r[key]||'')))].filter(Boolean).sort().map(x=>`<option ${state[key]===x?'selected':''} value="${esc(x)}">${esc(x)}</option>`).join('')}</select></div>`;return `<div class="toolbar"><div class="field search"><label>Buscar SKU / descripción / referencia</label><input id="search" data-filter="q" placeholder="Ej. NSYTRV42, ATV, TeSys, 1492..." value="${esc(state.q)}"></div>${kind==='ia'||kind==='power'?opt('family','Familia'):''}${kind!=='cruces'?opt('policy','Política'):''}${kind==='ia'?opt('rating','Coincidencia IA'):''}${kind==='cruces'?`<div class="field"><label>Revisión</label><select data-filter="crStatus"><option value="">Todos</option><option value="REVISAR AMPERAJE" ${state.crStatus==='REVISAR AMPERAJE'?'selected':''}>Revisar amperaje</option><option value="VALIDAR EN FICHAS DE FABRICANTE" ${state.crStatus==='VALIDAR EN FICHAS DE FABRICANTE'?'selected':''}>Validar fichas</option><option value="COINCIDENCIA TEXTUAL PARCIAL" ${state.crStatus==='COINCIDENCIA TEXTUAL PARCIAL'?'selected':''}>Coincidencia textual</option></select></div>`:''}<button class="btn" data-action="reset">Limpiar</button></div>`}
function pages(rows,fn){const p=Math.min(state.pageNo,Math.max(0,Math.ceil(rows.length/state.perPage)-1));const subset=rows.slice(p*state.perPage,(p+1)*state.perPage);return table(fn.headers,subset.map(fn.row))+`<div class="tablefoot"><span>Mostrando ${fmt(rows.length?p*state.perPage+1:0)}–${fmt(Math.min(rows.length,(p+1)*state.perPage))} de ${fmt(rows.length)} filas</span><div class="buttons"><button data-pager="prev" ${!p?'disabled':''}>← Anterior</button><button data-pager="next" ${(p+1)*state.perPage>=rows.length?'disabled':''}>Siguiente →</button></div></div>`}
function matchText(r){return !state.q||norm(Object.values(r).join(' ')).includes(norm(state.q))}
function filterA(){return A.filter(r=>matchText(r)&&(!state.family||r.family===state.family)&&(!state.policy||r.policy===state.policy)&&(!state.rating||r.rating===state.rating))}
function filterP(){return P.filter(r=>matchText(r)&&(!state.family||r.family===state.family)&&(!state.policy||r.policy===state.policy))}
function filterC(){return cross.filter(r=>matchText(r)&&(!state.crStatus||r.check===state.crStatus))}
function rowData(arr){return arr.map(r=>`<tr><td class="mono">${esc(r.sku)}</td><td>${esc(r.family||'Sin clasificar')}</td><td>${esc(r.description)}</td><td>${tag(r.policy)}</td><td>${r.qty==null?'<span class="badge warn">Sin cantidad</span>':fmt(r.qty)}</td><td>${tag(r.rating||r.ra||'—')}</td><td><button class="rowbtn" data-detail="${arr===A?'a':'p'}:${r.row}">Detalle</button></td></tr>`)}
function tableIA(){let f=filterA();return pages(f,{headers:['SKU Schneider','Familia','Descripción','Stock','Unidades','Coincidencia interna','Detalle'],row:r=>`<tr><td class="mono">${esc(r.sku)}</td><td>${esc(r.family)}</td><td>${esc(r.description)}</td><td>${tag(r.policy)}</td><td>${fmt(r.qty)}</td><td>${tag(r.rating)}</td><td><button class="rowbtn" data-detail="a:${r.row}">Detalle</button></td></tr>`})}
function tablePower(){let f=filterP();return pages(f,{headers:['SKU Schneider','Familia','Descripción','Stock','Unidades','Rockwell en origen','Detalle'],row:r=>`<tr><td class="mono">${esc(r.sku)}</td><td>${esc(r.family||'Sin clasificar')}</td><td>${esc(r.description)}</td><td>${tag(r.policy)}</td><td>${r.qty==null?'—':fmt(r.qty)}</td><td class="mono">${esc(r.ra||'No informado')}</td><td><button class="rowbtn" data-detail="p:${r.row}">Detalle</button></td></tr>`})}
function tableCross(){let f=filterC();return pages(f,{headers:['Código Rockwell','Schneider sugerido','Familia','Evaluación automática','Descripción','Detalle'],row:r=>`<tr><td class="mono">${esc(r.ra)}</td><td class="mono">${esc(r.sku)}</td><td>${esc(r.family)}</td><td>${tag(r.check)}</td><td>${esc(r.description)}</td><td><button class="rowbtn" data-detail="p:${r.row}">Detalle</button></td></tr>`})}
function summary(){let iaMTO=A.filter(x=>x.policy==='MTO'),highIA=A.filter(high),iaMTOHigh=A.filter(x=>x.policy==='MTO'&&high(x));let powerDups=dup.map(x=>x.diff);return hero('DIRECCIÓN GENERAL · GRUPO ABSA','Estrategia de portafolio Schneider','Revisión integral de demanda sugerida, catálogo, riesgo de duplicación, política MTO/MTS y relaciones Rockwell documentadas únicamente en el nuevo archivo.')+`<div class="kpis">${kp('SKU / registros propuestos',fmt(A.length+P.length),'855 IA + 328 Power')}${kp('Unidades propuestas',fmt(sum(A,x=>x.qty)+sum(P,x=>x.qty)),'Incluye 29 pzas normalizadas desde texto')}${kp('Presupuesto anotado',usd(budgetTotal),'No reconciliado por SKU')}${kp('Cruces Rockwell informados',fmt(cross.length),'Solo Power Products; 0 homologados')}${kp('SKU Power repetidos',fmt(dup.length),'146 filas adicionales','gold')}${kp('Diferencia escenario máximo',fmt(sum(dup,x=>x.diff))+' pzas','No equivale a sobrecompra demostrada','red')}${kp('High runners IA en MTO',fmt(iaMTOHigh.length),fmt(highIA.length)+' high runners totales','gold')}${kp('Amperajes por revisar',fmt(mismatch.length),'8 cruces con diferencia textual','red')}</div>`+heading('Qué significa la información','Insights identificados sin recurrir a ninguna versión anterior')+`<div class="grid three"><div class="callout"><div class="circle">1</div><div><strong>Controlar la compra por SKU</strong><p>La propuesta Power incluye 78 códigos repetidos. Eliminar filas automáticamente también puede subestimar necesidades legítimas: conciliar por demanda y aplicación.</p></div></div><div class="callout"><div class="circle">2</div><div><strong>Revisar política de inventario</strong><p>375 referencias high runner IA están en MTO. Evaluar MTS solo donde consumo, margen, plazo y obsolescencia justifiquen inversión.</p></div></div><div class="callout"><div class="circle">3</div><div><strong>Comercializar con validación</strong><p>84 pares Rockwell–Schneider se enumeran en el Excel, pero una relación textual no equivale a homologación eléctrica, dimensional ni normativa.</p></div></div></div>`+heading('¿Qué concentra las unidades?','Comparación por familia: conteo de piezas, no facturación')+`<div class="grid two"><div class="card"><h3>Industrial Automation</h3>${bars(group(A,x=>x.family),rs=>sum(rs,x=>x.qty),9)}</div><div class="card"><h3>Power Products</h3>${bars(group(P,x=>x.family||'Sin familia'),rs=>sum(rs,x=>x.qty),9)}</div></div>`+heading('Prioridades operativas')+`<div class="grid two"><div class="card"><h3>Inventario y capital de trabajo</h3><ul class="list"><li>Conciliar por SKU las 13,191 piezas Power.</li><li>Normalizar 48 filas sin cantidad sugerida.</li><li>Tratar las 19 referencias finales sin clasificación de producto como pendientes de catálogo.</li><li>Reconciliar los subtotales USD contra precios unitarios antes de aprobar compra.</li></ul></div><div class="card"><h3>Ingeniería y disponibilidad</h3><ul class="list"><li>Examinar 8 diferencias de amperaje aparentes.</li><li>Validar las 84 propuestas de referencia cruzada con fichas técnicas.</li><li>Confirmar plazos de 13 arrancadores suaves MTS con 22 semanas.</li><li>Revisar 33 políticas #N/A de Power y 3 de IA.</li></ul></div></div></section>`}
function iaPage(){let total=sum(A,x=>x.qty);return hero('INDUSTRIAL AUTOMATION','855 referencias Schneider','Análisis de señales de rotación, cantidades, prioridad interna, plazos y política de stock; sin usar otras matrices.')+`<div class="kpis">${kp('Referencias',fmt(A.length),'854 SKU únicos')}${kp('Unidades sugeridas',fmt(total),'Cantidad propuesta, no comprada')}${kp('MTO',fmt(A.filter(x=>x.policy==='MTO').length),'72.4% de registros')}${kp('MTS',fmt(A.filter(x=>x.policy==='MTS').length),'233 registros')}${kp('Coincidencia alta',fmt(A.filter(x=>x.rating==='Alta').length),'Calificación interna; no homologación')}${kp('Coincidencia media',fmt(A.filter(x=>x.rating==='Media').length),'351 registros')}${kp('Coincidencia baja',fmt(A.filter(x=>x.rating==='Baja').length),'102 registros')}${kp('High runner MTO',fmt(A.filter(x=>x.policy==='MTO'&&high(x)).length),'Revisar ABC y política')}
</div>`+heading('Composición por familia')+`<div class="grid two"><div class="card"><h3>Unidades sugeridas</h3>${bars(group(A,x=>x.family),rs=>sum(rs,x=>x.qty),12)}</div><div class="card"><h3>Registros por Helios</h3>${bars(group(A,x=>x.helios),rs=>rs.length,10)}<div class="hint">22 semanas MTS: 13 arrancadores ATS430/ATS490. Confirma disponibilidad antes de ofertar.</div></div></div>`+heading('Catálogo filtrable · 855 filas')+toolbar('ia')+`<div id="tableSlot">${tableIA()}</div></section>`}
function powerPage(){return hero('POWER PRODUCTS','328 renglones, 182 SKU','Análisis de calidad de captura, repeticiones, 84 referencias Rockwell relacionadas y cantidades de inventario sugeridas.')+`<div class="kpis">${kp('Registros',fmt(P.length),'182 SKU únicos')}${kp('Unidades normalizadas',fmt(sum(P,x=>x.qty)),'13,162 numéricas + 29 en texto')}${kp('Con descripción de familia',fmt(P.filter(x=>x.family).length),'19 renglones sin familia')}${kp('MTS / MTO',`${P.filter(x=>x.policy==='MTS').length} / ${P.filter(x=>x.policy==='MTO').length}`,'52 sin política válida')}${kp('Sin cantidad',fmt(P.filter(x=>x.qty==null).length),'No presupuestar automáticamente','gold')}${kp('SKU repetidos',fmt(dup.length),'146 apariciones adicionales','gold')}${kp('Cruces Rockwell',fmt(cross.length),'No validados')}${kp('Diferencia escenario máximo',fmt(sum(dup,x=>x.diff)),'Unidades hipotéticas, no sobrecompra','red')}</div>`+heading('Concentración de cantidades')+`<div class="grid two"><div class="card"><h3>Por familias</h3>${bars(group(P,x=>x.family||'Sin familia'),rs=>sum(rs,x=>x.qty),12)}</div><div class="card"><h3>Por política MTO / MTS</h3>${bars(group(P,x=>x.policy||'Sin política'),rs=>rs.length,8)}<p class="hint">En Power, «Coincidencia» contiene un código Rockwell, no un porcentaje de compatibilidad. La unidad de entrega aparece como número sin especificar su unidad de tiempo.</p></div></div>`+heading('Explorador Power Products · todos los renglones')+toolbar('power')+`<div id="tableSlot">${tablePower()}</div></section>`}
function crossPage(){return hero('MATRIZ INCLUIDA EN V2.2','84 cruces Rockwell → Schneider','Solo referencias explícitas de la hoja Power Products. No existe matriz de equivalencias de Industrial Automation dentro de este archivo.')+`<div class="kpis">${kp('Pares en archivo',fmt(cross.length),'84 códigos Rockwell únicos')}${kp('Pares interpretables por nomenclatura',fmt(cross.filter(x=>x.raAmpCandidate!=null).length),'23 con corriente y curva en descripción')}${kp('Diferencias aparentes',fmt(mismatch.length),'Corriente RA inferida vs descripción SE','red')}${kp('Homologaciones aprobadas','0','No consta acta ni ficha aprobatoria')}</div>`+heading('Cruces que requieren revisión de amperaje','Las magnitudes del código Rockwell se infieren por la nomenclatura; no están validadas con hojas de datos')+table(['Rockwell (origen)','Schneider (candidato)','A Rockwell inferidos','A Schneider descritos','Diferencia'],mismatch.map(r=>`<tr><td class="mono">${esc(r.ra)}</td><td class="mono">${esc(r.sku)}</td><td>${r.raAmpCandidate}</td><td>${r.seAmpDescription}</td><td>${tag(r.check)}</td></tr>`))+heading('Buscar las 84 correspondencias')+toolbar('cruces')+`<div id="tableSlot">${tableCross()}</div><p class="qa">La coincidencia de corriente, polos y curva no demuestra equivalencia funcional ni certificaciones intercambiables. Verificar tensión, capacidad de interrupción, norma, accesorios, montaje y aplicación.</p></section>`}
function duplicatePage(){let copies=dup.reduce((x,r)=>x+(r.count-1),0),total=sum(P,x=>x.qty),best=total-sum(dup,x=>x.diff),rows=dup.filter(r=>!state.q||norm([r.sku,r.family,r.records.map(x=>x.description).join(' ')].join(' ')).includes(norm(state.q)));return hero('CONTROL DEL INVENTARIO','SKU Power repetidos','Esta auditoría NO elimina cantidades por defecto. Confronta dos escenarios para identificar lo que requiere conciliación antes de aprobar la compra.')+`<div class="kpis">${kp('SKU repetidos',fmt(dup.length),'78 códigos con más de una fila')}${kp('Apariciones adicionales',fmt(copies),'Múltiples renglones')}${kp('Suma de todas las filas',fmt(total)+' pzas','Asume necesidades independientes')}${kp('Escenario máximo por SKU',fmt(best)+' pzas','Asume solapamiento; no validado')}${kp('Diferencia exploratoria',fmt(total-best)+' pzas','23.3% del total Power','red')}${kp('SKU únicos Power',fmt(new Set(P.map(x=>x.sku)).size),'Normalizados por trim / mayúsculas')}</div><div class="alertbox">Las 3,068 piezas de diferencia representan únicamente un escenario de conciliación. No son una sobrecompra demostrada; varios registros pueden corresponder a clientes, almacenes o proyectos distintos.</div>`+heading('Concentración de duplicados')+`<div class="card">${bars(group(dup,x=>x.family||'Sin familia'),rs=>sum(rs,x=>x.diff),12)}</div>`+heading('Tabla de los 78 SKU repetidos')+`<div class="toolbar"><div class="field search"><label>Buscar SKU / familia</label><input id="search" data-filter="q" placeholder="Buscar..." value="${esc(state.q)}"></div><button class="btn" data-action="reset">Limpiar</button></div>`+table(['SKU','Familia','Apariciones','Suma de filas','Máximo por SKU','Diferencia','Filas originales'],rows.map(r=>`<tr><td class="mono">${esc(r.sku)}</td><td>${esc(r.family)}</td><td>${r.count}</td><td>${fmt(r.total)}</td><td>${fmt(r.max)}</td><td>${fmt(r.diff)}</td><td>${r.records.map(x=>x.row).join(', ')}</td></tr>`))+'</section>'}
function risksPage(){return hero('AUDITORÍA DE DATOS','Riesgos, discrepancias y hallazgos','Clasificación derivada exclusivamente del archivo V2.2, con acciones concretas de ingeniería, producto, compras y finanzas.')+`<div class="kpis">${kp('Alertas documentadas',fmt(DB.alerts.length),'Trazabilidad a hoja y fila')}${kp('Discrepancias por corriente',fmt(mismatch.length),'Candidatos no aptos para 1:1','red')}${kp('Cantidad no capturada Power','48','Renglones Power')}${kp('Política Power no definida','52','33 #N/A + 19 sin dato')}</div>`+heading('Riesgos priorizados')+`<div class="grid two">${DB.alerts.map(a=>`<div class="callout"><div class="circle" style="background:${a.level==='CRÍTICA'?'#fce6e4':'#fff3df'}">!</div><div><div>${tag(a.level)} <span class="muted tiny">${esc(a.area)}</span></div><strong>${esc(a.title)}</strong><p>${esc(a.evidence)}</p><p><b>Acción:</b> ${esc(a.action)}</p><span class="src">Origen: ${esc(a.source)}</span></div></div>`).join('')}</div></section>`}
function budgetPage(){let maxi=Math.max(...B.map(x=>x.usd));return hero('FINANZAS / CAPITAL DE TRABAJO','Presupuesto anotado en V2.2','Importes obtenidos de las 9 celdas de subtotales en USD. La hoja no ofrece costo unitario y no permite reconstruir ROI, margen ni demanda por SKU.')+`<div class="kpis">${kp('Total de subtotales',usd(budgetTotal),'No orden autorizada')}${kp('Industrial Automation',usd(budgetIA),'5 subtotales')}${kp('Power Products',usd(budgetPP),'4 subtotales')}${kp('Participación IA',(100*budgetIA/budgetTotal).toFixed(1)+'%','Sobre monto preliminar')}</div>`+heading('Distribución por categoría','No sumar el total Power de la fila 312: ya está incluido en los cuatro subtotales del área')+`<div class="card">${[...B].sort((a,b)=>b.usd-a.usd).map(x=>`<div style="margin-bottom:16px"><div class="budget"><span>${esc(x.category)} <small class="muted">· ${esc(x.helios)}</small></span><strong>${usd(x.usd)}</strong></div><div class="track"><div class="fill" style="width:${(x.usd/maxi*100).toFixed(1)}%"></div></div><div class="tiny muted">${esc(x.division)} · subtotal en fila ${x.originRow}</div></div>`).join('')}</div>`+heading('Escenario de exposición de capital de trabajo')+`<div class="grid two"><div class="card"><h3>Escalar el presupuesto indicativo</h3><p class="tiny">Simulación proporcional únicamente; no valida cantidades ni precios unitarios.</p><div class="field"><label>Porcentaje del monto preliminar</label><input id="budgetPct" type="range" min="25" max="125" value="100" step="5"></div><h2 id="budgetAmount">${usd(budgetTotal)}</h2><div id="budgetNote" class="muted">100% del importe anotado en el Excel</div></div><div class="card"><h3>Necesidades antes de aprobación</h3><ul class="list"><li>Obtener lista de costos por SKU, moneda y descuentos.</li><li>Validar si el importe incluye o excluye impuestos, fletes, aranceles y refacciones.</li><li>Conciliar 78 SKU repetidos y 48 cantidades ausentes.</li><li>Aplicar ventas históricas, márgenes, rotación y costo financiero.</li></ul></div></div></section>`}
function planPage(){return hero('GOBIERNO DE HOMOLOGACIÓN','Plan de ejecución ABSA','Acciones sugeridas por área, separadas de cualquier supuesto de equivalencia aprobada o demanda comprobada.')+heading('Secuencia por prioridad')+table(['Prioridad','Responsable sugerido','Actividad','Criterio de terminación','Momento'],DB.actions.map(a=>`<tr><td>${tag(a.priority)}</td><td>${esc(a.owner)}</td><td><strong>${esc(a.title)}</strong></td><td>${esc(a.done)}</td><td>${esc(a.when)}</td></tr>`)) +heading('Criterios mínimos antes de liberar comercialización')+`<div class="card"><div class="grid two"><div><h3>Por SKU técnico</h3><ul class="list"><li>Hoja de datos y estado de vigencia.</li><li>Comparación de características eléctricas y mecánicas.</li><li>Certificaciones aplicables.</li><li>Accesorios, dimensiones y montaje.</li><li>Prueba/ingeniería y evidencia de aprobación.</li></ul></div><div><h3>Por inventario</h3><ul class="list"><li>Demanda por cliente, planta y zona.</li><li>Costo de compra, margen y cobertura.</li><li>Lead time confirmado por Schneider.</li><li>Frecuencia de consumo, devolución y obsolescencia.</li><li>Responsables de compras y autorización.</li></ul></div></div></div></section>`}
function methodPage(){return hero('TRAZABILIDAD','Metodología y limitaciones','El tablero solo interpreta las dos hojas del nuevo Excel V2.2. Los cruces no han sido aprobados ni contrastados contra fichas de fabricante.')+heading('Diccionario de datos')+table(['Campo / tema','Interpretación de este tablero'],[
['Fuente única',DB.meta.source],['Industrial Automation','855 registros con SKU; Coincidencia=Alta/Media/Baja es evaluación interna, no compatibilidad validada'],['Power Products','328 registros con SKU; Coincidencia=SKU Rockwell en 84 registros, NO nivel de compatibilidad'],['Unidades de Power','Se convierten 8 PZAS, 4 PZAS, 2 PZAS y 15 PZAS a números, por total 29; se preserva texto original'],['Duplicados','SKU normalizado por espacios y mayúsculas. El máximo por SKU es escenario ilustrativo y NO sustituye consolidación por demanda'],['Presupuesto','5 subtotales IA + 4 Power. Excluido total Power consolidado adicional (fila 312) para evitar duplicación'],['Plazos','IA indica semanas; Power contiene cantidades numéricas sin especificación de unidad; no son comparables'],['Cruces','84 pares de Power, 23 descifrables en corriente/polos/curva mediante nomenclatura. 8 con diferencias aparentes de amperaje; ninguna equivalencia homologada'],['Fuentes externas','Ninguna. No se utilizaron archivos anteriores, web, emails ni otros repositorios para este análisis.']

function showDetail(type,row){let r=(type==='a'?A:P).find(x=>String(x.row)===String(row));if(!r)return;let custom=[['Referencia Schneider',r.sku],['Familia',r.family],['Descripción',r.description],['HELIOS',r.helios],['Política stock',r.policy],['Cantidad sugerida (piezas)',r.qty],['Tiempo entrega',r.lead],['High runner',r.rotation],['Coincidencia interna (IA)',r.rating],['Referenciado Rockwell (Power)',r.ra],['Evaluación por descripción (Power)',r.check],['Comentario Control',r.control],['Comentario Inventarios',r.invcomment],['Observación adicional',r.extComment],['P1C',r.p1c],['Comentario Power',r.notes],['Cantidad original Power',r.qty_raw],['Fila fuente',r.row],['Hoja fuente',type==='a'?'Industrial Automation':'Power Products']].filter(([k,v])=>v!==undefined&&v!==''&&v!==null);$('detail').innerHTML=`<div class="eyebrow">DETALLE DEL SKU</div><h2>${esc(r.sku)}</h2><div class="notice">Candidato propuesto, no aprobado ni homologado. Revisar con ingeniería antes de sustituir una referencia.</div>${custom.map(([k,v])=>`<div class="detail-row"><small>${esc(k)}</small><strong>${esc(v)}</strong></div>`).join('')}`;$('shade').classList.add('open');$('drawer').classList.add('open')}

function csvString(v){return '"'+String(v??'').replaceAll('"','""')+'"'}
function csv(rows,name){if(!rows.length)return alert('Sin datos para exportar');const cols=Object.keys(rows[0]);let text='\ufeff'+cols.map(csvString).join(',')+'\r\n'+rows.map(r=>cols.map(k=>csvString(Array.isArray(r[k])?'':r[k])).join(',')).join('\r\n');const u=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));let a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function exportActive(){let rows=state.page==='ia'?filterA():state.page==='power'?filterP():state.page==='cruces'?filterC():state.page==='duplicados'?dup:state.page==='riesgos'?DB.alerts:state.page==='presupuesto'?B:state.page==='plan'?DB.actions:state.page==='resumen'?B:[];if(state.page==='duplicados')rows=rows.map(r=>({SKU:r.sku,grupo:r.family,repeticiones:r.count,suma:r.total,maximo:r.max,diferencia:r.diff,filas:r.records.map(x=>x.row).join(' / ')}));csv(rows,'ABSA_'+state.page+'_V2_2_exclusivo.csv')}
$('exportBtn').addEventListener('click',exportActive);$('menu').addEventListener('click',()=>{$('side').classList.toggle('open')});$('closeDrawer').addEventListener('click',closeDetail);$('shade').addEventListener('click',closeDetail);
document.addEventListener('click',e=>{let n=e.target.closest('[data-page]');if(n){state.page=n.dataset.page;state.q='';state.family='';state.policy='';state.rating='';state.crStatus='';state.pageNo=0;location.hash=state.page;$('side').classList.remove('open');render(true);return}n=e.target.closest('[data-detail]');if(n){const [t,row]=n.dataset.detail.split(':');showDetail(t,row);return}n=e.target.closest('[data-action]');if(n?.dataset.action==='reset'){state.q='';state.family='';state.policy='';state.rating='';state.crStatus='';state.pageNo=0;render();return}n=e.target.closest('[data-pager]');if(n){state.pageNo+=n.dataset.pager==='next'?1:-1;let fn=state.page==='ia'?tableIA:state.page==='power'?tablePower:tableCross;$('tableSlot').innerHTML=fn();return}});
document.addEventListener('change',e=>{let key=e.target.dataset.filter;if(key&&key!=='q'){state[key]=e.target.value;state.pageNo=0;render()}});
let timer;document.addEventListener('input',e=>{if(e.target.id==='budgetPct'){let pct=Number(e.target.value);$('budgetAmount').textContent=usd(budgetTotal*pct/100);$('budgetNote').textContent=pct+'% del importe anotado en Excel';return}if(e.target.dataset.filter==='q'){const pos=e.target.selectionStart;state.q=e.target.value;state.pageNo=0;clearTimeout(timer);timer=setTimeout(()=>{let current=state.page;if(current==='duplicados'){render()}else if(current==='ia')$('tableSlot').innerHTML=tableIA();else if(current==='power')$('tableSlot').innerHTML=tablePower();else if(current==='cruces')$('tableSlot').innerHTML=tableCross();let input=$('search');if(input){input.focus();try{input.setSelectionRange(pos,pos)}catch(e){}}},165)}});
window.addEventListener('hashchange',()=>{const s=location.hash.slice(1);if(pagesMap[s]&&s!==state.page){state.page=s;render(true)}});if(pagesMap[location.hash.slice(1)])state.page=location.hash.slice(1);render();
</script></body></html>
